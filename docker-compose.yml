services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      # SQLite DB — persisted across container restarts
      - db_data:/data
      # Obsidian vault — read-only mount from the host
      - ${VAULT_PATH}:/vault:ro
      # Claude session summaries — read-only. Optional: defaults to /dev/null
      # (not a dir) so the conversations indexer skips gracefully when unset.
      - ${MEMORY_SESSIONS_HOST:-/dev/null}:/memory/sessions:ro
    environment:
      DB_PATH: /data/brain.db
      VAULT_PATH: /vault
      MEMORY_SESSIONS_PATH: /memory/sessions
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Bind only to the Tailscale interface — never exposed to the public internet
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - backend

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
